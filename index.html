  <script>
    if (navigator.serviceWorker) {
      console.log("Searching for service worker...");
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => {
          for (let r of registrations) {
            console.log("Service worker found, attempting unregistration...");
            r.unregister();

          console.log("Unable to unregister service worker. Failed with error:", e);
        });
    }
  </script>

    // ----- Helper Functions -----
    function getRandomArbitrary(min, max) {
      return Math.random() * (max - min) + min;

    function calcPrevDate(daysAgo) {
      const now = new Date();
      const past = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysAgo);
      const m = past.getMonth() + 1;
      const d = past.getDate();
      return `${m < 10 ? "0" : ""}${m}${d < 10 ? "0" : ""}${d}${past.getFullYear() - 2000}`;

    // Generate visitor IDs based on current weekday (adds variation)
    function getDateBasedVisitorId(date) {
      const e = getRandomArbitrary(0, 3);
      const a = getRandomArbitrary(0, 2);

      // Switch by weekday (0 = Sunday, 6 = Saturday)
      switch ((date || new Date).getDay()) {
        case 1:
          i = visitors[Math.floor(Math.random() * visitors.length)];

          break;

          a < 1

          break;
        case 6:
          a < 1
            ? (i = visitors[Math.floor(Math.random() * getRandomArbitrary(12, 18))], visitor = `${i}${calcPrevDate(40)}@`)

          break;
        default:
          i = "Unknown";

      role = roles[visitors.indexOf(i) % roles.length];
      account_id = accounts[visitors.indexOf(i) % accounts.length];
      accString = account_id.replace(/\s/g, "");
      visitor = `${visitor}${accString}.com`;

      return visitor;
    }

    // Alternate ID generator (used for older accounts)
    function getVisitorId(acc) {
      const e = Math.random() * 100;
      if (e < 25) {
        visitor = `visitor1@${acc}.com`; role = "admin";
      } else if (e <= 50) {
        visitor = `visitor6@${acc}.com`; role = "admin";
      } else if (e <= 65) {
        visitor = `visitor4@${acc}.com`; role = "user";
      } else if (e <= 80) {
        visitor = `visitor7@${acc}.com`; role = "user";
      } else if (e <= 90) {
        visitor = `visitor5@${acc}.com`; role = "user";
      } else if (e <= 95) {
        visitor = `visitor3@${acc}.com`; role = "read-only";
      } else {
        visitor = `visitor2@${acc}.com`; role = "read-only";
      }
      return visitor;
    }

    // ----- Visitor initialization -----
    if (randomRoll > 2) {
      // 1/3 chance to pick "old" accounts
      account_id = oldAccounts[Math.floor(Math.random() * accounts.length)];
      accString = account_id.replace(/\s/g, "");
      getVisitorId(accString);
    } else {
      getDateBasedVisitorId();
    }

    // Override with URL params (if provided)
    account_id = urlAccount || account_id;
    visitor = `${urlVisitor || visitor.slice(0, visitor.indexOf("@"))}@${account_id.replace(/\s/g, "")}.com`;
    role = urlRole || role;

    // Store user info globally
    window.userInfo = {
      account: account_id,
      visitor: visitor.slice(0, visitor.indexOf("@")),
      visitorId: visitor,
      role: role
    };

    // ===== Initialize Pendo unless disabled =====

      (function (r, e, a, i, o) {

        (c = e.createElement(a)).async = true;
        c.src = "https://cdn.pendo.io/agent/static/1e4c08b9-e3d6-453a-b8cf-f567dd979553/pendo.js";
        (l = e.getElementsByTagName(a)[0]).parentNode.insertBefore(c, l);
      })(window, document, "script", "pendo");

      // Initialize with user info
      pendo.initialize({
        visitor: {
          id: visitor || "VISITOR-UNIQUE-ID",
          role: role || "user"
        },
        account: {
          id: account_id || "ACCOUNT-UNIQUE-ID"
        }
      });
    }
  </script>

  <script>
    // Wait until Pendo has loaded
    (function waitForPendo() {
      if (window.pendo && window.pendo.dom && typeof window.pendo.showGuideById === "function") {
        // Check for the element periodically in case it loads late
        const checkExist = setInterval(() => {
          const el = document.getElementById("metrics");
          if (el) {
            clearInterval(checkExist);
            // Launch guide when the element is present
            pendo.showGuideById("Vilx-C6_50ulQn-h48t7866jopM");
          }
        }, 1000);
      } else {
        // Retry until Pendo agent is ready
        setTimeout(waitForPendo, 500);
      }
    })();
  </script>
